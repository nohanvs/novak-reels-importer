name: Importar videos autorizados

on:
  workflow_dispatch:
    inputs:
      max_batches:
        description: "Quantidade de lotes (ate 3 videos por lote)"
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: novak-reels-importer
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar executor
        run: python -m pip install --disable-pip-version-check .

      - name: Processar fila
        env:
          NOVAK_API_BASE_URL: https://novak-reels.joao133762.chatgpt.site
          NOVAK_IMPORTER_TOKEN: ${{ secrets.NOVAK_IMPORTER_TOKEN }}
          NOVAK_SITES_AUTHORIZATION: ${{ secrets.NOVAK_SITES_AUTHORIZATION }}
          NOVAK_MAX_BATCHES: ${{ inputs.max_batches || '4' }}
        run: python -m novak_importer

