<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NovaK Reels</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;font-family:Arial,sans-serif;color:#fff}.card{width:min(92vw,520px);padding:28px;border:1px solid #333;border-radius:16px;background:#181818}h1{margin:0 0 8px;font-size:26px}p{color:#aaa;margin:0 0 22px}input{width:100%;padding:15px;border:1px solid #444;border-radius:10px;background:#0e0e0e;color:#fff;font-size:16px}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:10px;background:#fff;color:#111;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{min-height:24px;margin-top:16px;color:#bbb}.ok{color:#7ee787}.err{color:#ff7b72}.hint{font-size:13px;color:#777;margin-top:14px}
  </style>
</head>
<body>
  <main class="card">
    <h1>NovaK Reels</h1>
    <p>Cole o link do vídeo e toque em Postar.</p>
    <form id="form">
      <input id="url" type="url" placeholder="https://www.twitch.tv/.../clip/..." autocomplete="off" required>
      <button id="button" type="submit">Postar</button>
    </form>
    <div id="status"></div>
    <div class="hint">Use somente vídeos que você tem autorização para publicar.</div>
  </main>
  <script>
    const form=document.getElementById('form');
    const input=document.getElementById('url');
    const button=document.getElementById('button');
    const status=document.getElementById('status');
    form.addEventListener('submit',async(e)=>{
      e.preventDefault();
      button.disabled=true; status.className=''; status.textContent='Enviando...';
      try{
        const response=await fetch('/api/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sourceUrl:input.value.trim()})});
        const data=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(data.error||'Não foi possível enviar o vídeo.');
        status.className='ok'; status.textContent='Vídeo enviado para a fila de postagem.'; input.value='';
      }catch(error){status.className='err';status.textContent=error.message||'Erro ao enviar.'}
      finally{button.disabled=false}
    });
  </script>
</body>
</html>
