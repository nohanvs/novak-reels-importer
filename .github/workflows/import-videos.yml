name: Import and publish authorized videos

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: novak-reels-queue
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install importer
        run: python -m pip install --disable-pip-version-check .

      - name: Process queue and upload watermarked videos
        env:
          NOVAK_API_BASE_URL: ${{ secrets.NOVAK_API_BASE_URL }}
          NOVAK_IMPORTER_TOKEN: ${{ secrets.NOVAK_IMPORTER_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NOVAK_MAX_BATCHES: "0"
        run: python -m novak_importer

      - name: Publish Instagram Reels
        env:
          NOVAK_API_BASE_URL: ${{ secrets.NOVAK_API_BASE_URL }}
          NOVAK_IMPORTER_TOKEN: ${{ secrets.NOVAK_IMPORTER_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: "v23.0"
        run: python -m novak_publisher
