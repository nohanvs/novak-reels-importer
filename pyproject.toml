[build-system]
requires = ["setuptools>=78,<79"]
build-backend = "setuptools.build_meta"

[project]
name = "novak-reels-importer"
version = "0.3.0"
description = "Worker de processamento e publicação do NovaK Reels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp[default]==2026.8.19",
]

[project.scripts]
novak-importer = "novak_importer:main"
novak-publisher = "novak_publisher:main"

[tool.setuptools]
py-modules = ["novak_importer", "novak_publisher"]
package-dir = {"" = "src"}
